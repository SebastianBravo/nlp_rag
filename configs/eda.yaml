# Parámetros del perfilado del corpus (Fase A). Se copian a reports/eda/profile.json en cada ejecución.
seed: 42
batch_size: 4000                # filas por lote al leer el texto
# Tokenizador de referencia para contar tokens (perfiles en configs/encoders.yaml).
encoders_config: configs/encoders.yaml
encoder_profile: e5-small

samples:
  sizes: [2000, 10000]          # anidadas: la de 2.000 está contenida en la de 10.000
  strata: [collection_name, language_base]
  min_share: 0.01               # idiomas con menos del 1 % del corpus forman el estrato "otro"

tokens:
  thresholds: [256, 512]        # se reporta el porcentaje de documentos por encima de cada umbral

language:
  max_chars: 1000               # el detector lee solo el inicio de cada texto
  min_share: 0.01               # idiomas fuera de la matriz de acuerdo se agrupan en "otro"
  length_bins: [0, 50, 100, 200, 500, 1000, 5000, 1000000]   # caracteres, para el acuerdo por longitud

dates:
  # Fechas anteriores a este inicio se reportan como no plausibles para la colección
  # (Bluesky abrió en 2023; un created_at anterior es una fecha retroactiva fijada por el cliente).
  plausible_start: {bluesky_posts: '2023-01-01'}

near_duplicates:
  sample: 10000                 # tamaño de la muestra (debe estar en samples.sizes)
  shingle_words: 5
  num_perm: 128
  threshold: 0.8                # Jaccard mínimo, confirmado con el valor exacto
  examples_per_type: 5

noise:
  short_words: 5                # menos palabras que esto cuenta como texto muy corto
  boilerplate_collections: [url_crawls]
  boilerplate_min_chars: 20     # líneas más cortas no se consideran
  boilerplate_min_docs: 20      # una línea es boilerplate si aparece en tantos documentos del mismo dominio

urls:
  tracking_params: ['utm_*', fbclid, gclid, dclid, msclkid, mc_cid, mc_eid, igshid, _ga, _gl, ref_src]
  top_domains: 20

acquisition_fields: [strategy, source_type, country_key, keyword_family, collection_keyword_label]
