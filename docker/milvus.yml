# Milvus standalone, su infraestructura (etcd, MinIO) y Attu para inspeccionar colecciones.
services:
  etcd:
    container_name: rag-etcd
    image: quay.io/coreos/etcd:v3.5.25
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls=http://0.0.0.0:2379 --data-dir=/etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes: [etcd_data:/etcd]
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 15s
      timeout: 10s
      retries: 10
  minio:
    container_name: rag-minio
    # Imagen de MinIO que publica Milvus; la de AIStor exige licencia y sin ella rechaza todas las operaciones S3
    image: milvusdb/minio:RELEASE.2024-12-18T13-15-44Z
    command: minio server /minio_data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes: [minio_data:/minio_data]
    ports: ["9001:9001"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 10s
      retries: 10
  milvus:
    container_name: rag-milvus
    image: milvusdb/milvus:v2.6.6
    command: ["milvus", "run", "standalone"]
    # Si pierde su sesión en etcd (p. ej. con la CPU saturada por el LLM), Milvus termina; así se levanta solo.
    restart: unless-stopped
    security_opt: ["seccomp:unconfined"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_REGION: us-east-1
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin
    volumes: [milvus_data:/var/lib/milvus]
    ports: ["19530:19530", "9091:9091"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    depends_on:
      etcd: {condition: service_healthy}
      minio: {condition: service_healthy}
  attu:
    container_name: rag-attu
    image: zilliz/attu:v2.6.4
    environment:
      MILVUS_URL: milvus:19530
    ports: ["3000:3000"]
    depends_on:
      milvus: {condition: service_healthy}
volumes:
  etcd_data:
  minio_data:
  milvus_data:
